{% extends 'layout.html' %}
{% block content %}
<div class="container text-center mt-5">
    <div class="card p-4 shadow-sm border-0" style="max-width: 400px; margin: auto;">
        <h3>Thanh toán đơn #ORD-{{ order.id }}</h3>
        <p class="text-muted">Quét mã QR dưới đây để chuyển khoản:</p>
        
        
        <img src="https://api.vietqr.io/image/970415-123456789-default.jpg?amount={{ order.total_amount }}&addInfo=ORD{{ order.id }}" 
             alt="QR Thanh toán" class="img-fluid my-3">
        
        <h4 class="text-danger">{{ '{:,.0f}'.format(order.total_amount) }} đ</h4>
        
        <form action="{{ url_for('confirm_payment', order_id=order.id) }}" method="POST">
            <button type="submit" class="btn btn-success w-100 mt-3 fw-bold">Thanh toán thành công</button>
        </form>
    </div>
</div>
{% endblock %}
