{% extends 'layout.html' %}
{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <div class="mb-4">
                <h3 class="fw-bold text-dark">Hồ Sơ Cá Nhân</h3>
                <p class="text-muted small">Quản lý thông tin tài khoản và bảo mật cá nhân</p>
            </div>

            <div class="row g-4">
                <!-- Cột 1: Cập nhật thông tin -->
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm p-4 rounded-4 h-100 bg-white">
                        <h5 class="fw-bold text-dark mb-3">Thông Tin Tài Khoản</h5>
                        
                        <form method="POST">
                            <input type="hidden" name="action" value="update_info">
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary small">Email đăng nhập</label>
                                <input type="email" class="form-control bg-light border-0 py-2" value="{{ user.email }}" disabled>
                                <div class="form-text small text-muted">Email không thể thay đổi.</div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary small">Họ và tên</label>
                                <input type="text" name="name" class="form-control bg-light border-0 py-2" value="{{ user.name }}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary small">Vai trò hệ thống</label>
                                <input type="text" class="form-control bg-light border-0 py-2" value="{{ user.role }}" disabled>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold shadow-sm py-2 mt-2">Lưu thông tin</button>
                        </form>
                    </div>
                </div>

                <!-- Cột 2: Đổi mật khẩu -->
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm p-4 rounded-4 h-100 bg-white">
                        <h5 class="fw-bold text-dark mb-3">Đổi Mật Khẩu</h5>
                        
                        <form method="POST">
                            <input type="hidden" name="action" value="change_password">
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary small">Mật khẩu hiện tại</label>
                                <input type="password" name="old_password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary small">Mật khẩu mới</label>
                                <input type="password" name="new_password" class="form-control bg-light border-0 py-2" placeholder="Tối thiểu 6 ký tự" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary small">Xác nhận mật khẩu mới</label>
                                <input type="password" name="confirm_password" class="form-control bg-light border-0 py-2" placeholder="Nhập lại mật khẩu mới" required>
                            </div>
                            
                            <button type="submit" class="btn btn-outline-primary w-100 rounded-pill fw-bold shadow-sm py-2 mt-2">Đổi mật khẩu</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
