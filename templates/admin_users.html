{% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2>Quản lý thành viên</h2>
    <p class="text-muted">Danh sách người dùng do admin quản lý.</p>
  </div>
  <a href="{{ url_for('admin_add_user') }}" class="btn btn-success">Tạo tài khoản mới</a>
</div>
<div class="card shadow-sm p-4">
  <div class="table-responsive">
    <table class="table align-middle">
      <thead class="table-light">
        <tr><th>#</th><th>Tên</th><th>Email</th><th>Quyền</th></tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{% if user.is_admin %}Admin{% else %}Thành viên{% endif %}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
